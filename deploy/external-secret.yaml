apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-tasks-api-v3-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openhorizons-dev-secret-store
  target:
    name: backend-tasks-api-v3-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: PostgreSuraOh
