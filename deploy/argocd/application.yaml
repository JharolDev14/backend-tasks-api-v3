apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-tasks-api-v3
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/SuraOhorizons/backend-tasks-api-v3.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
