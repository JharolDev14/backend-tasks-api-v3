name: Build and Deploy ACR

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'deploy/**'

  workflow_dispatch:

permissions:
  contents: write

env:
  ACR_NAME: crsuradev
  REGISTRY: crsuradev.azurecr.io
  IMAGE_NAME: backend-tasks-api-v3
  VERSION_PREFIX: sura.v

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry Login
        run: |
          echo "===== Azure Container Registry ====="

          az acr show \
            --name "$ACR_NAME" \
            --output table

          az acr login \
            --name "$ACR_NAME"


      - name: Calculate Image Version
        id: version
        shell: bash
        run: |
          echo "===== CALCULATING IMAGE VERSION ====="

          LAST_VERSION=$(
            az acr repository show-tags \
              --name "$ACR_NAME" \
              --repository "$IMAGE_NAME" \
              --output tsv |
              grep -E "^${VERSION_PREFIX}[0-9]+$" |
              sed "s/^${VERSION_PREFIX}//" |
              sort -n |
              tail -1
          )

          if [ -z "$LAST_VERSION" ]; then
            LAST_VERSION=0
          fi

          NEXT_VERSION=$((LAST_VERSION + 1))

          IMAGE_TAG="${VERSION_PREFIX}${NEXT_VERSION}"
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Last version : ${LAST_VERSION}"
          echo "Next version : ${NEXT_VERSION}"
          echo "Image tag    : ${IMAGE_TAG}"
          echo "Full image   : ${FULL_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"


      - name: Build Docker Image
        run: |
          echo "===== BUILDING IMAGE ====="

          docker build \
            -t "$FULL_IMAGE" \
            .

      - name: Push Docker Image
        run: |
          echo "===== PUSHING IMAGE ====="

          docker push "$FULL_IMAGE"

      - name: Verify Image in ACR
        run: |
          echo "===== VERIFYING IMAGE ====="

          az acr repository show \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output table

          echo "Checking tag: $IMAGE_TAG"

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --output tsv |
            grep -Fx "$IMAGE_TAG"


      - name: Setup Kustomize
        if: github.ref == 'refs/heads/main'
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "===== UPDATING KUSTOMIZE ====="

          cd deploy

          kustomize edit set image \
            app-image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo
          echo "===== UPDATED KUSTOMIZATION ====="
          cat kustomization.yaml

      - name: Commit Kustomize Update
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          echo "===== COMMITTING KUSTOMIZE UPDATE ====="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No Kustomize changes detected."
            exit 0
          fi

          git commit \
            -m "chore(deploy): update backend image to ${IMAGE_TAG}"

          git push
